name: Paybridge checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: paybridge-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public fixtures for compilation only. This job never deploys or signs in.
      VITE_FIREBASE_API_KEY: ci-public-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: eng-agency-test.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: eng-agency-test
      VITE_FIREBASE_APP_ID: ci-public-placeholder
      VITE_STAFF_API_ORIGIN: https://eng-agency-test.vercel.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/*.test.ts
      - run: npm run build
