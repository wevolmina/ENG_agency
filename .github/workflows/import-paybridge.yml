name: Import Paybridge repository
on:
  push:
    paths:
      - '.github/workflows/import-paybridge.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'wevolmina/ENG_agency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import source history and files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wevolmina"
          git config user.email "346683009+wevolmina@users.noreply.github.com"
          git fetch https://github.com/wevolmina/paybridge-mock.git main
          source_sha=$(git rev-parse FETCH_HEAD)
          test "$source_sha" = "195675ea475cfad8d7873c1139ecb3d0221e9e06"
          git switch --detach "$source_sha"
          git merge --no-commit --allow-unrelated-histories -s ours origin/main
          git rm -r .github/workflows
          git restore --source=origin/main --staged --worktree -- .github/workflows
          git commit -m "Import paybridge-mock main with source history"
          git push origin HEAD:main
