name: Deploy ENG agency cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: eng-agency-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENG_AGENCY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_STAFF_API_ORIGIN: ${{ vars.VITE_STAFF_API_ORIGIN }}
      VITE_CUSTOMER_SITE_URL: ${{ vars.VITE_CUSTOMER_SITE_URL }}
      VITE_USE_EMULATORS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/check-static-deploy-env.mjs cloudflare
      - run: npm ci
      - run: npm test
      - run: npm run build --workspace @bridge/admin
      - name: Deploy admin static assets
        working-directory: apps/admin
        run: npx --no-install wrangler deploy
