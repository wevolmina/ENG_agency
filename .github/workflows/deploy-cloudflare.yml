name: Deploy admin to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'packages/staff-ui/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-static-deploy-env.mjs'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paybridge-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: paybridge-mock
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_STAFF_API_ORIGIN: https://paybridge-mock.vercel.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Check deployment configuration without logging values
        run: node scripts/check-static-deploy-env.mjs cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm ci
      - run: node --import tsx --test tests/*.test.ts
      - run: npm run build:admin
      - name: Validate Worker bundle without uploading
        working-directory: apps/admin
        run: npx --no-install wrangler deploy --dry-run
      - name: Skip outdated target files, allow newer documentation-only commits
        id: revision
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          git diff --name-only "$GITHUB_SHA" FETCH_HEAD -- apps/admin packages/staff-ui package.json package-lock.json scripts/check-static-deploy-env.mjs .github/workflows/deploy-cloudflare.yml > "$RUNNER_TEMP/static-release-changes.txt"
          if [ -s "$RUNNER_TEMP/static-release-changes.txt" ]; then
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Newer target files exist on main; skipped this outdated deployment.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Worker static assets
        if: steps.revision.outputs.current == 'true'
        working-directory: apps/admin
        run: npx --no-install wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Record deployment
        if: steps.revision.outputs.current == 'true'
        run: echo 'Admin Worker paybridge-admin deployed from commit ${{ github.sha }}. See Wrangler output for the actual URL.' >> "$GITHUB_STEP_SUMMARY"
